name: Release Packages

'on':
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-packages:
    name: Build (${{ matrix.os_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            os_name: macOS
            artifact_id: macos
            setup_linux_tools: false
            setup_windows_tools: false
            tasks: createDistributable packageDmg
            create_tarball: false

          - os: windows-latest
            os_name: Windows
            artifact_id: windows
            setup_linux_tools: false
            setup_windows_tools: true
            tasks: packageMsi packageExe createDistributable
            create_tarball: false

          - os: ubuntu-latest
            os_name: Linux (x64)
            artifact_id: linux-x64
            setup_linux_tools: true
            setup_windows_tools: false
            tasks: packageDeb packageRpm createDistributable
            arch_suffix: x64
            create_tarball: true

          - os: ubuntu-24.04-arm
            os_name: Linux (ARM64)
            artifact_id: linux-arm64
            setup_linux_tools: true
            setup_windows_tools: false
            tasks: packageDeb packageRpm createDistributable
            arch_suffix: arm64
            create_tarball: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Linux Packaging Tools (Deb & RPM)
        if: matrix.setup_linux_tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot binutils

      - name: Setup WiX Toolset (Windows)
        if: matrix.setup_windows_tools
        shell: pwsh
        run: |
          $wix3_11 = "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          $wix3_14 = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          if (Test-Path $wix3_11) {
            Write-Host "Found WiX Toolset v3.11 at $wix3_11"
            "$wix3_11" | Out-File -Append -FilePath $env:GITHUB_PATH
          } elseif (Test-Path $wix3_14) {
            Write-Host "Found WiX Toolset v3.14 at $wix3_14"
            "$wix3_14" | Out-File -Append -FilePath $env:GITHUB_PATH
          } else {
            Write-Host "Installing WiX Toolset via Chocolatey..."
            choco install wixtoolset -y --no-progress
            "$wix3_11" | Out-File -Append -FilePath $env:GITHUB_PATH
          }

      - name: Extract Release Version
        id: get_version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building KNet release version: $VERSION"

      - name: Grant execute permission for gradlew
        shell: bash
        run: chmod +x gradlew

      - name: Build Native Distribution Packages
        shell: bash
        run: ./gradlew ${{ matrix.tasks }} "-Pknet.app.version=${{ steps.get_version.outputs.VERSION }}"

      - name: Build Branded macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          echo "Installing create-dmg and fileicon..."
          brew install create-dmg fileicon || true

          APP_PATH="apps/desktop/build/compose/binaries/main/app/KNet.app"
          ICON_PATH="apps/desktop/src/jvmMain/resources/icons/KNet.icns"
          BG_PATH="brand/dmg/knet-dmg-background.png"
          RAW_DMG="apps/desktop/build/compose/binaries/main/dmg/KNet-${VERSION}.dmg"
          BRANDED_DMG="apps/desktop/build/compose/binaries/main/dmg/KNet-${VERSION}-mac.dmg"

          if [ -d "$APP_PATH" ]; then
            echo "Creating branded DMG using create-dmg..."
            create-dmg \
              --volname "KNet ${VERSION}" \
              --volicon "${ICON_PATH}" \
              --background "${BG_PATH}" \
              --window-pos 200 120 \
              --window-size 560 380 \
              --icon-size 96 \
              --icon "KNet.app" 140 190 \
              --hide-extension "KNet.app" \
              --app-drop-link 420 190 \
              --no-internet-enable \
              "${BRANDED_DMG}" \
              "${APP_PATH}" || true

            if [ -f "${BRANDED_DMG}" ]; then
              echo "Stamping KNet icon onto the DMG file in Finder..."
              fileicon set "${BRANDED_DMG}" "${ICON_PATH}" || true
              echo "Branded macOS DMG ready at ${BRANDED_DMG}"
            else
              echo "create-dmg failed; stamping icon on the standard Compose DMG as fallback..."
              fileicon set "${RAW_DMG}" "${ICON_PATH}" || true
            fi

            # Remove the raw Compose DMG so only one DMG is ever staged and published
            if [ -f "${RAW_DMG}" ] && [ -f "${BRANDED_DMG}" ]; then
              rm -f "${RAW_DMG}"
              echo "Removed raw Compose DMG to prevent duplicate upload."
            fi
          fi

      - name: Package macOS Portable Zip
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          APP_DIR="apps/desktop/build/compose/binaries/main/app"
          if [ -d "$APP_DIR/KNet.app" ]; then
            echo "Creating macOS portable ZIP with native bundle metadata..."
            cd "$APP_DIR"
            ditto -c -k --sequesterRsrc --keepParent "KNet.app" "KNet-${VERSION}-mac.zip"
            echo "macOS portable ZIP created: KNet-${VERSION}-mac.zip"
          fi

      - name: Package Windows Portable Zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"
          $appPath = "apps/desktop/build/compose/binaries/main/app"
          if (Test-Path $appPath) {
            Write-Host "Creating Windows portable ZIP from $appPath..."
            Compress-Archive -Path "$appPath\*" -DestinationPath "apps/desktop/build/compose/binaries/main/KNet-$version-windows-x64.zip" -Force
            Write-Host "Windows portable ZIP created: KNet-$version-windows-x64.zip"
          }

      - name: Create Linux Portable Tarball
        if: matrix.create_tarball
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          ARCH="${{ matrix.arch_suffix }}"
          APP_DIR="apps/desktop/build/compose/binaries/main/app"
          ICON_SRC="apps/desktop/src/jvmMain/resources/icons/KNet.png"

          if [ -d "$APP_DIR" ]; then
            echo "Adding GUI launcher and desktop integration to portable Linux bundle..."
            cp "$ICON_SRC" "$APP_DIR/knet.png"

            printf "[Desktop Entry]\nName=KNet\nComment=Network Inspector & API Studio\nExec=bin/knet\nIcon=knet\nTerminal=false\nType=Application\nCategories=Development;Network;\nStartupWMClass=com-devuloopers-knet-apps-desktop-MainKt\n" > "$APP_DIR/knet.desktop"
            chmod +x "$APP_DIR/knet.desktop"
            chmod +x "$APP_DIR/bin/knet" 2>/dev/null || true

            cd apps/desktop/build/compose/binaries/main
            tar -czvf "knet-${VERSION}-linux-${ARCH}.tar.gz" -C app .
            echo "Linux portable tarball created: knet-${VERSION}-linux-${ARCH}.tar.gz"
          fi

      - name: Stage Release Artifacts
        shell: bash
        run: |
          mkdir -p dist-packages
          VERSION="${{ steps.get_version.outputs.VERSION }}"

          # macOS: Prefer branded DMG; fallback to standard Compose DMG
          BRANDED="apps/desktop/build/compose/binaries/main/dmg/KNet-${VERSION}-mac.dmg"
          COMPOSE_DMG="apps/desktop/build/compose/binaries/main/dmg/KNet-${VERSION}.dmg"
          if [ -f "${BRANDED}" ]; then
            cp -f "${BRANDED}" dist-packages/
            echo "Staged branded macOS DMG: ${BRANDED}"
          elif [ -f "${COMPOSE_DMG}" ]; then
            cp -f "${COMPOSE_DMG}" dist-packages/
            echo "Staged standard macOS DMG: ${COMPOSE_DMG}"
          fi

          # macOS: Portable ZIP
          MAC_ZIP="apps/desktop/build/compose/binaries/main/app/KNet-${VERSION}-mac.zip"
          if [ -f "${MAC_ZIP}" ]; then
            cp -f "${MAC_ZIP}" dist-packages/
            echo "Staged macOS portable ZIP: ${MAC_ZIP}"
          fi

          # Windows: Portable ZIP
          WIN_ZIP="apps/desktop/build/compose/binaries/main/KNet-${VERSION}-windows-x64.zip"
          if [ -f "${WIN_ZIP}" ]; then
            cp -f "${WIN_ZIP}" dist-packages/
            echo "Staged Windows portable ZIP: ${WIN_ZIP}"
          fi

          # Windows (MSI, EXE) and Linux (DEB, RPM)
          if [ -d "apps/desktop/build/compose/binaries/main" ]; then
            for dir in msi exe deb rpm; do
              if [ -d "apps/desktop/build/compose/binaries/main/$dir" ]; then
                cp -f apps/desktop/build/compose/binaries/main/$dir/* dist-packages/ 2>/dev/null || true
              fi
            done
            for tarball in apps/desktop/build/compose/binaries/main/*.tar.gz; do
              if [ -f "$tarball" ]; then
                cp -f "$tarball" dist-packages/ 2>/dev/null || true
              fi
            done
          fi

          echo "Staged files in dist-packages/ for upload:"
          ls -la dist-packages/

          STAGED=$(ls -1 dist-packages/ 2>/dev/null | wc -l)
          if [ "$STAGED" -eq 0 ]; then
            echo "ERROR: No distribution packages were staged for upload!"
            exit 1
          fi

      - name: Upload Staged Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: knet-release-packages-${{ matrix.artifact_id }}
          path: dist-packages/*
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish Single GitHub Release
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Release Version
        id: get_version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            TAG_NAME="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            TAG_NAME="${GITHUB_REF_NAME}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Publishing KNet release version: $VERSION with tag: $TAG_NAME"

      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: knet-release-packages-*
          path: release-dist
          merge-multiple: true

      - name: Inspect Downloaded Packages
        shell: bash
        run: |
          echo "All packages ready for publishing in release-dist/:"
          ls -la release-dist/

      - name: Generate Formatted Release Distribution Notes
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          TAG_NAME="${{ steps.get_version.outputs.TAG_NAME }}"
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG_NAME}"

          {
            echo "### Downloads & Packages"
            echo ""
            echo "| Platform | Architecture | Primary Installer | Portable / Alternative |"
            echo "|:---|:---|:---|:---|"
            echo "| **macOS** | Universal (Apple Silicon & Intel) | [\`KNet-${VERSION}-mac.dmg\`](${BASE_URL}/KNet-${VERSION}-mac.dmg) | [\`KNet-${VERSION}-mac.zip\`](${BASE_URL}/KNet-${VERSION}-mac.zip) |"
            echo "| **Windows** | x64 | [\`KNet-${VERSION}.exe\`](${BASE_URL}/KNet-${VERSION}.exe)<br>[\`KNet-${VERSION}.msi\`](${BASE_URL}/KNet-${VERSION}.msi) | [\`KNet-${VERSION}-windows-x64.zip\`](${BASE_URL}/KNet-${VERSION}-windows-x64.zip) |"
            echo "| **Linux** | x64 (amd64) | [\`knet_${VERSION}-1_amd64.deb\`](${BASE_URL}/knet_${VERSION}-1_amd64.deb)<br>[\`knet-${VERSION}-1.x86_64.rpm\`](${BASE_URL}/knet-${VERSION}-1.x86_64.rpm) | [\`knet-${VERSION}-linux-x64.tar.gz\`](${BASE_URL}/knet-${VERSION}-linux-x64.tar.gz) |"
            echo "| **Linux** | ARM64 (aarch64) | [\`knet_${VERSION}-1_arm64.deb\`](${BASE_URL}/knet_${VERSION}-1_arm64.deb)<br>[\`knet-${VERSION}-1.aarch64.rpm\`](${BASE_URL}/knet-${VERSION}-1.aarch64.rpm) | [\`knet-${VERSION}-linux-arm64.tar.gz\`](${BASE_URL}/knet-${VERSION}-linux-arm64.tar.gz) |"
            echo ""
            echo "---"
          } > release_body.md

          echo "Generated release_body.md:"
          cat release_body.md

      - name: Create Single GitHub Release with Changelog
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
          name: KNet v${{ steps.get_version.outputs.VERSION }}
          body_path: release_body.md
          files: release-dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
