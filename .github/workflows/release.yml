name: Release Packages

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-packages:
    name: Build (${{ matrix.os_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            os_name: macOS
            setup_linux_tools: false
            tasks: createDistributable packageDmg
            artifact_patterns: apps/desktop/build/compose/binaries/main/dmg/*.dmg
            create_tarball: false

          - os: windows-latest
            os_name: Windows
            setup_linux_tools: false
            tasks: packageMsi packageExe
            artifact_patterns: |
              apps/desktop/build/compose/binaries/main/msi/*.msi
              apps/desktop/build/compose/binaries/main/exe/*.exe
            create_tarball: false

          - os: ubuntu-latest
            os_name: Linux (x64)
            setup_linux_tools: true
            tasks: packageDeb packageRpm createDistributable
            arch_suffix: x64
            artifact_patterns: |
              apps/desktop/build/compose/binaries/main/deb/*.deb
              apps/desktop/build/compose/binaries/main/rpm/*.rpm
              apps/desktop/build/compose/binaries/main/*.tar.gz
            create_tarball: true

          - os: ubuntu-24.04-arm
            os_name: Linux (ARM64)
            setup_linux_tools: true
            tasks: packageDeb packageRpm createDistributable
            arch_suffix: arm64
            artifact_patterns: |
              apps/desktop/build/compose/binaries/main/deb/*.deb
              apps/desktop/build/compose/binaries/main/rpm/*.rpm
              apps/desktop/build/compose/binaries/main/*.tar.gz
            create_tarball: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Linux Packaging Tools (Deb & RPM)
        if: matrix.setup_linux_tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot

      - name: Extract Release Version
        id: get_version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building KNet release version: $VERSION"

      - name: Grant execute permission for gradlew
        shell: bash
        run: chmod +x gradlew

      - name: Build Native Distribution Packages
        shell: bash
        run: ./gradlew ${{ matrix.tasks }} "-Pknet.app.version=${{ steps.get_version.outputs.VERSION }}"

      - name: Build Branded macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          echo "Installing create-dmg..."
          brew install create-dmg || true

          APP_PATH="apps/desktop/build/compose/binaries/main/app/KNet.app"
          ICON_PATH="apps/desktop/src/jvmMain/resources/icons/KNet.icns"
          BG_PATH="brand/dmg/knet-dmg-background.png"
          BRANDED_DMG="apps/desktop/build/compose/binaries/main/dmg/KNet-${VERSION}-mac.dmg"

          if [ -d "$APP_PATH" ]; then
            echo "Creating branded DMG using create-dmg..."
            create-dmg \
              --volname "KNet ${VERSION}" \
              --volicon "${ICON_PATH}" \
              --background "${BG_PATH}" \
              --window-pos 200 120 \
              --window-size 560 380 \
              --icon-size 96 \
              --icon "KNet.app" 140 190 \
              --hide-extension "KNet.app" \
              --app-drop-link 420 190 \
              --no-internet-enable \
              "${BRANDED_DMG}" \
              "${APP_PATH}" || true

            if [ -f "${BRANDED_DMG}" ]; then
              echo "Branded macOS DMG created successfully at ${BRANDED_DMG}"
            else
              echo "create-dmg finished; fallback standard DMG will be published."
            fi
          fi

      - name: Create Linux Portable Tarball
        if: matrix.create_tarball
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          ARCH="${{ matrix.arch_suffix }}"
          cd apps/desktop/build/compose/binaries/main
          tar -czvf "knet-${VERSION}-linux-${ARCH}.tar.gz" -C app .
          echo "Linux portable tarball created: knet-${VERSION}-linux-${ARCH}.tar.gz"

      - name: Upload Staged Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: knet-release-packages-${{ matrix.os_name }}
          path: ${{ matrix.artifact_patterns }}
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish Single GitHub Release
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Release Version
        id: get_version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            TAG_NAME="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            TAG_NAME="${GITHUB_REF_NAME}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Publishing KNet release version: $VERSION with tag: $TAG_NAME"

      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: knet-release-packages-*
          path: release-dist
          merge-multiple: true

      - name: Inspect Downloaded Packages
        shell: bash
        run: |
          echo "Packages ready for publishing in release-dist/:"
          ls -lh release-dist/

      - name: Create Single GitHub Release with Changelog
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
          name: KNet v${{ steps.get_version.outputs.VERSION }}
          files: release-dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
