name: Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example, v1.0.0)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '21'

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      android-version-code: ${{ steps.release.outputs.android-version-code }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Check out release revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate tag and derive versions
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          TAG="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must use semantic versioning with a v prefix (for example, v1.2.3)." >&2
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "Release tag does not exist in the repository: $TAG" >&2
            exit 1
          fi

          VERSION="${TAG#v}"
          PRERELEASE=false
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "android-version-code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  release-qualification:
    name: Release qualification
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.2.0
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.0.0

      - name: Run architecture and protocol gates
        run: >-
          ./gradlew
          verifyArchitectureFoundation
          http2Qualification
          grpcQualification
          websocketQualification
          graphqlWebSocketQualification
          sseQualification
          --no-daemon
          --stacktrace

  ios-qualification:
    name: iOS companion qualification
    needs: metadata
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.2.0
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.0.0

      - name: Qualify Kotlin iOS targets
        run: ./gradlew companionIosProductQualification --no-daemon --stacktrace

      - name: Build unsigned release Simulator application
        run: >-
          xcodebuild
          -project products/companion/iosApp/KNetCompanion.xcodeproj
          -scheme 'KNet Companion'
          -sdk iphonesimulator
          -configuration Release
          -derivedDataPath products/companion/iosApp/build/release-derived-data
          CODE_SIGNING_ALLOWED=NO
          build

  android-package:
    name: Signed Android companion
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    env:
      ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ vars.ANDROID_RELEASE_KEY_ALIAS }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.tag }}

      - name: Set keystore path
        run: echo "ANDROID_RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/knet-companion-release.p12" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.2.0
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.0.0

      - name: Install Android SDK platform
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37'

      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          test -n "$ANDROID_RELEASE_KEYSTORE_PASSWORD"
          test -n "$ANDROID_RELEASE_KEY_ALIAS"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_RELEASE_KEYSTORE_FILE"
          chmod 600 "$ANDROID_RELEASE_KEYSTORE_FILE"

      - name: Qualify and build signed release APK
        run: >-
          ./gradlew
          companionAndroidProductQualification
          :products:companion:androidApp:lintRelease
          :products:companion:androidApp:assembleRelease
          -Pknet.app.version=${{ needs.metadata.outputs.version }}
          -Pknet.android.versionCode=${{ needs.metadata.outputs.android-version-code }}
          --no-daemon
          --stacktrace

      - name: Verify and stage signed APK
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          APK='products/companion/androidApp/build/outputs/apk/release/androidApp-release.apk'
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p dist-packages
          cp "$APK" "dist-packages/KNet-Companion-${VERSION}-android.apk"

      - name: Remove restored keystore
        if: always()
        shell: bash
        run: rm -f "$ANDROID_RELEASE_KEYSTORE_FILE"

      - name: Upload Android package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: knet-release-android
          path: dist-packages/*
          if-no-files-found: error
          retention-days: 7

  desktop-packages:
    name: Desktop package (${{ matrix.name }})
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            artifact: macos-arm64
            platform: macos
            architecture: arm64
            tasks: ':products:desktop:createDistributable :products:desktop:packageDmg'
          - name: macOS Intel
            runner: macos-15-intel
            artifact: macos-x64
            platform: macos
            architecture: x64
            tasks: ':products:desktop:createDistributable :products:desktop:packageDmg'
          - name: Windows x64
            runner: windows-2025
            artifact: windows-x64
            platform: windows
            architecture: x64
            tasks: ':products:desktop:createDistributable :products:desktop:packageMsi :products:desktop:packageExe'
          - name: Linux x64
            runner: ubuntu-24.04
            artifact: linux-x64
            platform: linux
            architecture: x64
            tasks: ':products:desktop:createDistributable :products:desktop:packageDeb :products:desktop:packageRpm'
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64
            platform: linux
            architecture: arm64
            tasks: ':products:desktop:createDistributable :products:desktop:packageDeb :products:desktop:packageRpm'
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.2.0
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.0.0

      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm fakeroot binutils

      - name: Ensure WiX Toolset is available
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $wixPaths = @(
            'C:\Program Files (x86)\WiX Toolset v3.14\bin',
            'C:\Program Files (x86)\WiX Toolset v3.11\bin'
          )
          $wixPath = $wixPaths | Where-Object { Test-Path (Join-Path $_ 'candle.exe') } | Select-Object -First 1
          if (-not $wixPath) {
            choco install wixtoolset --yes --no-progress
            $wixPath = $wixPaths | Where-Object { Test-Path (Join-Path $_ 'candle.exe') } | Select-Object -First 1
          }
          if (-not $wixPath) { throw 'WiX Toolset 3 was not found after installation.' }
          $wixPath | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Build native packages
        shell: bash
        env:
          GRADLE_TASKS: ${{ matrix.tasks }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: ./gradlew $GRADLE_TASKS "-Pknet.app.version=$VERSION" --no-daemon --stacktrace

      - name: Build branded macOS DMG
        if: matrix.platform == 'macos'
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          brew install create-dmg fileicon || true
          APP_PATH='products/desktop/build/compose/binaries/main/app/KNet.app'
          ICON_PATH='products/desktop/src/jvmMain/resources/icons/KNet.icns'
          BACKGROUND_PATH='desktopBrand/dmg/knet-dmg-background.png'
          BRANDED_DMG="products/desktop/build/compose/binaries/main/dmg/KNet-${VERSION}-macos-${ARCHITECTURE}.dmg"
          rm -f "$BRANDED_DMG"
          if command -v create-dmg >/dev/null && [[ -d "$APP_PATH" ]]; then
            create-dmg \
              --volname "KNet $VERSION" \
              --volicon "$ICON_PATH" \
              --background "$BACKGROUND_PATH" \
              --window-pos 200 120 \
              --window-size 560 380 \
              --icon-size 96 \
              --icon 'KNet.app' 140 190 \
              --hide-extension 'KNet.app' \
              --app-drop-link 420 190 \
              --no-internet-enable \
              "$BRANDED_DMG" \
              "$APP_PATH" || rm -f "$BRANDED_DMG"
          fi
          if [[ -f "$BRANDED_DMG" ]] && command -v fileicon >/dev/null; then
            fileicon set "$BRANDED_DMG" "$ICON_PATH" || true
          fi

      - name: Create macOS portable archive
        if: matrix.platform == 'macos'
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          APP_DIR='products/desktop/build/compose/binaries/main/app'
          test -d "$APP_DIR/KNet.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR/KNet.app" "$APP_DIR/KNet-${VERSION}-macos-${ARCHITECTURE}.zip"

      - name: Create Windows portable archive
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          $appPath = 'products/desktop/build/compose/binaries/main/app'
          if (-not (Test-Path $appPath)) { throw "Desktop application directory is missing: $appPath" }
          Compress-Archive -Path "$appPath\*" -DestinationPath "products/desktop/build/compose/binaries/main/KNet-$env:VERSION-windows-x64.zip" -Force

      - name: Create Linux portable archive
        if: matrix.platform == 'linux'
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          APP_DIR='products/desktop/build/compose/binaries/main/app'
          test -d "$APP_DIR"
          tar -czf "products/desktop/build/compose/binaries/main/KNet-${VERSION}-linux-${ARCHITECTURE}.tar.gz" -C "$APP_DIR" .

      - name: Stage desktop packages
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          OUTPUT='products/desktop/build/compose/binaries/main'
          mkdir -p dist-packages

          if [[ "$PLATFORM" == 'macos' ]]; then
            DMG="$OUTPUT/dmg/KNet-${VERSION}-macos-${ARCHITECTURE}.dmg"
            if [[ ! -f "$DMG" ]]; then
              compose_dmgs=("$OUTPUT"/dmg/*.dmg)
              [[ ${#compose_dmgs[@]} -eq 1 ]]
              DMG="${compose_dmgs[0]}"
            fi
            cp "$DMG" "dist-packages/KNet-${VERSION}-macos-${ARCHITECTURE}.dmg"
            cp "$OUTPUT/app/KNet-${VERSION}-macos-${ARCHITECTURE}.zip" dist-packages/
            EXPECTED=2
          elif [[ "$PLATFORM" == 'windows' ]]; then
            msi_packages=("$OUTPUT"/msi/*.msi)
            exe_packages=("$OUTPUT"/exe/*.exe)
            [[ ${#msi_packages[@]} -eq 1 && ${#exe_packages[@]} -eq 1 ]]
            cp "${msi_packages[0]}" dist-packages/
            cp "${exe_packages[0]}" dist-packages/
            cp "$OUTPUT/KNet-${VERSION}-windows-x64.zip" dist-packages/
            EXPECTED=3
          else
            deb_packages=("$OUTPUT"/deb/*.deb)
            rpm_packages=("$OUTPUT"/rpm/*.rpm)
            [[ ${#deb_packages[@]} -eq 1 && ${#rpm_packages[@]} -eq 1 ]]
            cp "${deb_packages[0]}" dist-packages/
            cp "${rpm_packages[0]}" dist-packages/
            cp "$OUTPUT/KNet-${VERSION}-linux-${ARCHITECTURE}.tar.gz" dist-packages/
            EXPECTED=3
          fi

          ACTUAL="$(find dist-packages -maxdepth 1 -type f | wc -l | tr -d ' ')"
          [[ "$ACTUAL" -eq "$EXPECTED" ]]
          ls -la dist-packages

      - name: Upload desktop packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: knet-release-${{ matrix.artifact }}
          path: dist-packages/*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub release
    needs:
      - metadata
      - release-qualification
      - ios-qualification
      - android-package
      - desktop-packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          ref: ${{ needs.metadata.outputs.tag }}

      - name: Download release packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: knet-release-*
          path: release-dist
          merge-multiple: true

      - name: Validate packages and generate checksums
        shell: bash
        run: |
          PACKAGE_COUNT="$(find release-dist -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [[ "$PACKAGE_COUNT" -ne 14 ]]; then
            echo "Expected 14 release packages, found $PACKAGE_COUNT." >&2
            find release-dist -maxdepth 1 -type f -print | sort
            exit 1
          fi
          (
            cd release-dist
            find . -maxdepth 1 -type f -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
          )
          ls -la release-dist

      - name: Attest release packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-path: release-dist/*

      - name: Generate release notes header
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          cat > release_body.md <<EOF
          ## KNet $VERSION packages

          This release includes native desktop packages for macOS (Apple Silicon and Intel), Windows x64, Linux x64/ARM64, and a signed Android companion APK. The iOS companion is source-qualified but is not distributed here because App Store and physical-device Network Extension signing require an eligible Apple Developer team.

          Verify any downloaded package against \`SHA256SUMS\`. GitHub artifact attestations are also attached to this release.
          EOF

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          prerelease_args=()
          if [[ "$PRERELEASE" == 'true' ]]; then
            prerelease_args+=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "KNet $VERSION" --notes-file release_body.md "${prerelease_args[@]}"
            gh release upload "$TAG" release-dist/* --clobber
          else
            gh release create "$TAG" release-dist/* \
              --verify-tag \
              --title "KNet $VERSION" \
              --notes-file release_body.md \
              --generate-notes \
              "${prerelease_args[@]}"
          fi
