worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json application/xml image/svg+xml;
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
        # Variables avoid location-level add_header blocks dropping the security headers.
        set $asset_cache "no-cache";
        add_header Cache-Control $asset_cache always;
        location = /healthz { access_log off; default_type text/plain; return 200 'ok\n'; }
        location ~ "^/(assets/[^/]+-[A-Za-z0-9_-]{8,}\.(js|css)|generated/traffic-[0-9]+-[a-f0-9]{12}\.(webp|avif))$" {
            set $asset_cache "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
        location / { try_files $uri $uri/ =404; }
        error_page 404 /404.html;
        location = /404.html { internal; }
    }
}
