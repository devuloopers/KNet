// Optional artwork regeneration only; ordinary website builds never load Gradle or Compose.
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':ui:desktop:app')
    app.kotlin.sourceSets.getByName('jvmTest').kotlin.srcDir(
        new File(gradle.rootProject.projectDir, 'tools/website/src'))
    app.dependencies.add('jvmTestImplementation', app.project(':ui:desktop:httpPanel'))
    app.tasks.withType(Test).configureEach {
        systemProperty 'knet.website.artwork', new File(gradle.rootProject.projectDir,
            'products/website/artwork/traffic-preview.png').absolutePath
        systemProperty 'user.timezone', 'UTC'
    }
}
